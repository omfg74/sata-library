# Манифест полки. Слот — сата-плата 1…4, диск — номер 1…4 на этой плате.
# Серийник берётся из identify и сюда переписывается руками.
# Пока строка пустая, backup для этого диска запрещён.
# path_contains — кусок /dev/disk/by-path этого диска. На живом запуске пустой фильтр запрещён.
# mount — каталог, куда rsync кладёт архив. Каталог должен быть уже смонтирован.
# spin_pause_s — пауза между раскрутками дисков одного включения слота.

spin_pause_s = 8

[[disk]]
slot = 1
index = 1
serial = "REPLACE-ME"
path_contains = ""
mount = ""

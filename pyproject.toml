[project]
name = "sata-library"
version = "0.1.0"
description = "Host for a shelf of stationary disks. An ESP32 switches 12 V; the host copies with rsync over USB."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
sata-library = "sata_library.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "sata-library"
version = "0.1.0"
description = "Host policy for a library of stationary HDDs and one moving SATA plug"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
sata-library = "sata_library.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
